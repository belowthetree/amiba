name: Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: 27.0.12077973

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check if version changed
        id: check
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Android project exists
        if: steps.check.outputs.skip == 'false'
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "❌ src-tauri/gen/android/ 不存在！"
            echo "请先在本地运行：cargo tauri android init"
            echo "然后把 src-tauri/gen/android/ 提交到仓库"
            exit 1
          fi

      - name: Setup Android SDK
        if: steps.check.outputs.skip == 'false'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973'

      - name: Set NDK env
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Setup Rust with Android targets
        if: steps.check.outputs.skip == 'false'
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          rustup component add rust-std --target aarch64-linux-android
          rustup component add rust-std --target x86_64-linux-android

      - name: Install sccache
        if: steps.check.outputs.skip == 'false'
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: Configure sccache
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p src-tauri/.cargo
          echo "[env]" > src-tauri/.cargo/config.toml
          echo 'RUSTC_WRAPPER = "sccache"' >> src-tauri/.cargo/config.toml
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Cache Rust
        if: steps.check.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-android-cargo-

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: npm ci

      - name: Build frontend
        if: steps.check.outputs.skip == 'false'
        run: npm run build

      - name: Decode keystore for signing
        if: steps.check.outputs.skip == 'false'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=amiba" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "✅ keystore decoded and ready for signing"
          else
            echo "⚠️ KEYSTORE_BASE64 not set — building unsigned APK"
          fi

      - name: Build APK
        if: steps.check.outputs.skip == 'false'
        run: npx tauri android build

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check.outputs.version }}
          name: v${{ steps.check.outputs.version }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
