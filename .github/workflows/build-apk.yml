name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973'

      - name: Check Android project exists
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "❌ src-tauri/gen/android/ 不存在！"
            echo "请先在本地运行：cargo tauri android init"
            echo "然后把 src-tauri/gen/android/ 提交到仓库"
            exit 1
          fi

      - name: Set NDK env
        run: |
          ANDROID_NDK="$ANDROID_HOME/ndk/27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_NDK" >> $GITHUB_ENV
          echo "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build APK (release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-linux-android
          tauriScript: npx tauri

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amiba-android
          path: src-tauri/gen/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
