name: Build Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-android, i686-linux-android, x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;28.0.12674087'

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: Configure sccache
        run: |
          mkdir -p src-tauri/.cargo
          echo "[build]" > src-tauri/.cargo/config.toml
          echo 'rustflags = ["-C", "link-args=-Wl,--compress-debug-sections=zlib"]' >> src-tauri/.cargo/config.toml
          echo "[env]" >> src-tauri/.cargo/config.toml
          echo 'RUSTC_WRAPPER = "sccache"' >> src-tauri/.cargo/config.toml
          echo "SCCACHE_GHA_ENABLED = \"true\"" >> $GITHUB_ENV

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Android Tauri CLI
        run: npx tauri android init

      - name: Build Android APK
        run: npx tauri android build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amiba-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/apk/**/*.aab
