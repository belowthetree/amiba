name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/Cargo.toml'
      - 'package.json'
  workflow_dispatch:

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Bump version & tag
        id: bump
        run: |
          # 从 tauri.conf.json 读取当前版本
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "当前版本: $VERSION"

          # 自增 patch 号
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          TAG="v$NEW_VERSION"
          echo "新版本: $NEW_VERSION"

          # 更新 tauri.conf.json
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('./src-tauri/tauri.conf.json','utf8'));
            cfg.version = '$NEW_VERSION';
            fs.writeFileSync('./src-tauri/tauri.conf.json', JSON.stringify(cfg, null, 2) + '\n');
          "

          # 更新 package.json（如果存在 version 字段）
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./package.json','utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          " || true

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Commit & push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json package.json
          git commit -m "release: ${{ steps.bump.outputs.version }}" || true
          git tag ${{ steps.bump.outputs.tag }}
          git push origin main --tags
