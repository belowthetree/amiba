<!-- AMIBA_BRIDGE -->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.widget-root {
  min-width: 200px; max-width: 300px;
  padding: 14px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #FFFFFF;
  color: #1F2329;
  border-radius: 12px;
}
.wi-title { font-size: 13px; font-weight: 600; color: #1F2329; margin-bottom: 8px; }
.wi-input {
  width: 100%; padding: 8px 10px; border: 1px solid #E5E7EB;
  border-radius: 8px; font-size: 13px; font-family: inherit; line-height: 1.5; resize: none;
  background: #F5F6F8; color: #1F2329; outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}
.wi-input:focus { border-color: #6366F1; background: #FFFFFF; box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }
.wi-input::placeholder { color: #9CA3AF; }
.wi-save {
  width: 100%; margin-top: 8px; padding: 8px 0; border: none; border-radius: 8px;
  background: #6366F1; color: #fff; font-size: 13px; font-weight: 500;
  font-family: inherit; cursor: pointer;
  transition: background 0.15s ease, transform 0.15s ease;
}
.wi-save:hover { background: #4F46E5; }
.wi-save:active { transform: scale(0.97); }
.wi-recent { margin-top: 10px; border-top: 1px solid #F3F4F6; padding-top: 8px; }
.wi-recent-item {
  font-size: 12px; color: #6B7280; line-height: 1.5;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 0;
}
.wi-empty { font-size: 12px; color: #9CA3AF; padding: 4px 0; }
</style>
<div class="widget-root">
  <div class="wi-title">📝 快速记录</div>
  <textarea class="wi-input" id="wi-input" rows="2" placeholder="随手记..."></textarea>
  <button class="wi-save" id="wi-save">保存</button>
  <div class="wi-recent" id="wi-recent"></div>
</div>
<script>
(function() {
  var STORAGE_KEY = 'notes';

  var el = function(id) { return document.getElementById(id); };

  async function save() {
    var text = el('wi-input').value.trim();
    if (!text) return;
    var notes = await __amiba__.storage.get(STORAGE_KEY);
    if (!Array.isArray(notes)) notes = [];
    notes.unshift({ id: 'n' + Date.now(), text: text, at: Date.now() });
    await __amiba__.storage.set(STORAGE_KEY, notes);
    el('wi-input').value = '';
    renderRecent(notes);
  }

  el('wi-save').onclick = function() { save(); };
  el('wi-input').onkeydown = function(e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) save();
  };

  function renderRecent(notes) {
    var box = el('wi-recent');
    if (!notes || notes.length === 0) {
      box.innerHTML = '<div class="wi-empty">暂无笔记</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < Math.min(3, notes.length); i++) {
      html += '<div class="wi-recent-item">· ' + _esc(notes[i].text) + '</div>';
    }
    box.innerHTML = html;
  }

  function _esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // 轮询 storage，保持与主界面数据同步
  function poll() {
    __amiba__.storage.get(STORAGE_KEY).then(function(notes) {
      renderRecent(Array.isArray(notes) ? notes : []);
    }).catch(function() {});
  }
  setInterval(poll, 2000);
  poll();
})();
</script>
