<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>记账本</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <div class="header">
    <h1>💰 记账本</h1>
    <span class="month-total">本月支出 <b>¥{{ monthTotal.toFixed(2) }}</b></span>
  </div>

  <!-- 记一笔 -->
  <div class="card">
    <div class="form-row">
      <input type="number" v-model.number="form.amount" placeholder="金额" min="0" step="0.01">
      <select v-model="form.category">
        <option v-for="c in categories" :key="c" :value="c">{{ c }}</option>
      </select>
    </div>
    <div class="form-row">
      <input type="text" v-model.trim="form.note" placeholder="备注（可选）" maxlength="30">
      <button class="btn btn-primary" @click="addRecord" :disabled="!form.amount">记一笔</button>
    </div>
  </div>

  <!-- 图表 -->
  <div class="card" v-if="records.length">
    <div class="card-title">本月分类占比</div>
    <div class="chart-box"><canvas id="chart-pie"></canvas></div>
    <div class="card-title">近 6 个月趋势</div>
    <div class="chart-box"><canvas id="chart-bar"></canvas></div>
  </div>

  <!-- 明细 -->
  <div class="card">
    <div class="card-title">明细（{{ records.length }} 条）</div>
    <div class="record-list">
      <div class="record-item" v-for="r in sortedRecords" :key="r.id">
        <span class="record-cat">{{ categoryIcon(r.category) }} {{ r.category }}</span>
        <span class="record-note">{{ r.note || '—' }}</span>
        <span class="record-amount">-¥{{ r.amount.toFixed(2) }}</span>
        <span class="record-date">{{ formatDate(r.at) }}</span>
        <button class="record-del" @click="removeRecord(r.id)">✕</button>
      </div>
      <div class="empty" v-if="!records.length">还没有记录，写下第一笔吧</div>
    </div>
  </div>

</div>
<script src="/libs/chart.umd.min.js"></script>
<script src="/libs/vue.global.prod.js"></script>
<script src="app.js"></script>
</body>
</html>
