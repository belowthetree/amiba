<!-- AMIBA_BRIDGE -->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.widget-root {
  min-width: 180px; max-width: 240px;
  padding: 14px 16px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #FFFFFF;
  color: #1F2329;
  border-radius: 12px;
  text-align: center;
}
.wi-mode { font-size: 12px; font-weight: 500; color: #6B7280; }
.wi-time {
  font-size: 34px; font-weight: 700; color: #1F2329;
  font-variant-numeric: tabular-nums; letter-spacing: 1px; margin: 4px 0 10px;
}
.wi-time.running { color: #6366F1; }
.wi-btns { display: flex; gap: 8px; justify-content: center; }
.wi-btn {
  padding: 6px 16px; font-size: 13px; border: none; border-radius: 8px; cursor: pointer;
  background: #6366F1; color: #fff; font-family: inherit;
  transition: background 0.15s ease, transform 0.15s ease;
}
.wi-btn:hover { background: #4F46E5; }
.wi-btn:active { transform: scale(0.97); }
.wi-btn.ghost { background: #F5F6F8; color: #6B7280; border: 1px solid #E5E7EB; }
.wi-btn.ghost:hover { background: #EEF2FF; color: #6366F1; border-color: #6366F1; }
</style>
<div class="widget-root">
  <div class="wi-mode" id="wi-mode">🍅 番茄钟</div>
  <div class="wi-time" id="wi-time">25:00</div>
  <div class="wi-btns">
    <button class="wi-btn" id="wi-toggle">▶️</button>
    <button class="wi-btn ghost" id="wi-reset">↺</button>
  </div>
</div>
<script>
(function() {
  var STATE_KEY = 'pomodoro_state';
  var DURATIONS = { work: 25 * 60, break: 5 * 60 };
  var state = { mode: 'work', running: false, remaining: DURATIONS.work };
  var bgReady = false;

  var el = function(id) { return document.getElementById(id); };

  async function ensureBg() {
    if (bgReady) return true;
    try {
      var s = await __amiba__.background.getState();
      if (!s.running) {
        await __amiba__.background.start();
        var s2 = await __amiba__.background.getState();
        if (!s2.running) throw new Error('启动失败');
      }
      bgReady = true;
      return true;
    } catch (e) {
      bgReady = false;
      return false;
    }
  }

  async function postBg(action, data) {
    if (!(await ensureBg())) return;
    __amiba__.background.postMessage({ action: action, data: data || {} });
  }

  el('wi-toggle').onclick = function() {
    if (state.running) {
      postBg('pause');
    } else if (state.remaining > 0 && state.remaining < DURATIONS[state.mode]) {
      postBg('resume');
    } else {
      postBg('start', { mode: state.mode, duration: DURATIONS[state.mode] });
    }
  };

  el('wi-reset').onclick = function() { postBg('reset'); };

  function render() {
    el('wi-mode').textContent = state.mode === 'work' ? '🍅 专注' : '☕ 休息';
    var sec = state.remaining;
    var m = Math.floor(sec / 60), s = sec % 60;
    el('wi-time').textContent = (m < 10 ? '0' + m : '' + m) + ':' + (s < 10 ? '0' + s : '' + s);
    el('wi-time').className = 'wi-time' + (state.running ? ' running' : '');
    el('wi-toggle').textContent = state.running ? '⏸' : '▶️';
  }

  // 轮询 storage 同步后台状态
  function poll() {
    __amiba__.storage.get(STATE_KEY).then(function(s) {
      if (s) { state = s; render(); }
    }).catch(function() {});
  }
  setInterval(poll, 1000);
  poll();
})();
</script>
