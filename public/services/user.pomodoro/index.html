<!-- AMIBA_BRIDGE -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>番茄钟</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <div class="header">
    <h1>🍅 番茄钟</h1>
    <span class="today-count" id="today-count"></span>
  </div>

  <!-- 计时器 -->
  <div class="timer-card">
    <div class="mode-tabs">
      <button class="mode-tab active" id="tab-work">🍅 专注 25 分钟</button>
      <button class="mode-tab" id="tab-break">☕ 休息 5 分钟</button>
    </div>
    <div class="timer-display" id="timer-display">25:00</div>
    <div class="timer-status" id="timer-status">准备开始</div>
    <div class="timer-btns">
      <button class="btn btn-primary" id="btn-start">▶️ 开始</button>
      <button class="btn" id="btn-reset">↺ 重置</button>
    </div>
  </div>

  <!-- 悬浮块开关 -->
  <div class="section">
    <button class="btn block" id="btn-toggle-widget">🧩 显示/隐藏悬浮计时器</button>
  </div>

  <p class="hint">倒计时在后台运行，关闭页面也会继续，完成时弹出提醒。悬浮计时器可吸附在屏幕边缘随时查看。</p>

</div>
<script src="app.js"></script>
</body>
</html>
