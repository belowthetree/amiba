<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>演示遥控器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <!-- 模式选择 -->
  <div id="mode-view">
    <div class="header"><h1>🎮 演示遥控器</h1></div>
    <p class="hint">两台设备各选一端：放映端展示幻灯片，遥控端远程翻页。</p>
    <div class="mode-cards">
      <button class="mode-card" id="btn-mode-screen">
        <span class="mode-icon">🖥️</span>
        <span class="mode-name">放映端</span>
        <span class="mode-desc">全屏展示幻灯片，等待遥控</span>
      </button>
      <button class="mode-card" id="btn-mode-remote">
        <span class="mode-icon">📱</span>
        <span class="mode-name">遥控端</span>
        <span class="mode-desc">连接放映端，远程翻页</span>
      </button>
    </div>
  </div>

  <!-- 放映端 -->
  <div id="screen-view" style="display:none">
    <div class="slide-stage" id="slide-stage">
      <div class="slide-emoji" id="slide-emoji">🎬</div>
      <div class="slide-title" id="slide-title">演示遥控器</div>
      <div class="slide-body" id="slide-body">等待遥控端连接...</div>
    </div>
    <div class="screen-bar">
      <span id="screen-status">🔍 等待遥控端连接</span>
      <span id="screen-page">1 / 1</span>
      <button class="btn btn-sm" id="btn-exit-screen">退出</button>
    </div>
  </div>

  <!-- 遥控端 -->
  <div id="remote-view" style="display:none">
    <div class="header"><h1>📱 遥控端</h1><button class="btn btn-sm" id="btn-exit-remote">退出</button></div>

    <div class="section" id="remote-devices">
      <div class="section-title">
        <span>选择放映端</span>
        <button class="btn btn-sm" id="btn-refresh">🔄 扫描</button>
      </div>
      <div class="device-list" id="device-list">
        <p class="hint">🔍 正在发现设备...</p>
      </div>
    </div>

    <div class="section" id="remote-controls" style="display:none">
      <div class="remote-status">
        <span id="remote-target"></span>
        <span id="remote-page">- / -</span>
      </div>
      <div class="remote-btns">
        <button class="btn-nav" id="btn-prev">⏮<br>上一页</button>
        <button class="btn-nav" id="btn-next">下一页<br>⏭</button>
      </div>
      <button class="btn btn-sm block" id="btn-blank">⬛ 黑屏/恢复</button>
    </div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
