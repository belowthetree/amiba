<!-- AMIBA_BRIDGE -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音乐播放器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <div class="header">
    <div class="logo">🎵</div>
    <h1>音乐播放器</h1>
    <p class="subtitle">本地音乐 · 后台播放 · 悬浮控制</p>
  </div>

  <!-- 文件夹选择 -->
  <div class="section" id="folder-section">
    <button class="btn btn-primary" id="btn-pick-folder">
      <span class="btn-icon">📁</span> 选择音乐文件夹
    </button>
    <div class="folder-info" id="folder-info" style="display:none">
      <span class="folder-path" id="folder-path"></span>
      <button class="btn btn-text" id="btn-repick">更换</button>
    </div>
  </div>

  <!-- 曲库 -->
  <div class="section" id="library-section" style="display:none">
    <div class="lib-header">
      <span class="track-count" id="track-count"></span>
      <button class="btn btn-sm" id="btn-rescan">🔄 重新扫描</button>
    </div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="搜索歌曲...">
    </div>
    <div class="track-list" id="track-list"></div>
  </div>

  <!-- 播放器（吸底） -->
  <div class="player" id="player" style="display:none">
    <div class="cover" id="cover">
      <span class="cover-icon" id="cover-icon">🎵</span>
    </div>
    <div class="player-body">
      <div class="now-playing" id="now-playing" title="">未在播放</div>
      <div class="progress-bar" id="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
        <div class="progress-thumb" id="progress-thumb"></div>
      </div>
      <div class="time-row">
        <span id="time-current">0:00</span>
        <span id="time-duration">0:00</span>
      </div>
      <div class="controls">
        <button class="btn-ctrl btn-mode" id="btn-mode" title="播放模式">🔁</button>
        <button class="btn-ctrl" id="btn-prev">⏮</button>
        <button class="btn-ctrl btn-play" id="btn-play">▶️</button>
        <button class="btn-ctrl" id="btn-next">⏭</button>
        <div class="volume-wrap">
          <span class="vol-icon">🔊</span>
          <input type="range" id="volume-slider" min="0" max="100" value="80">
        </div>
      </div>
    </div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
