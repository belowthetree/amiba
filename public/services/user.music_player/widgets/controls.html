<!-- AMIBA_BRIDGE -->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; }
.widget-root {
  width: 240px; height: 240px;
  padding: 16px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  background: var(--color-surface, #fff);
  color: var(--color-text, #333);
  border-radius: 6px;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.cover-area {
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: var(--color-bg, #f5f5f5); border-radius: 6px; margin-bottom: 12px;
  font-size: 40px;
}
.track-name {
  font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; margin-bottom: 6px;
}
.progress {
  height: 3px; background: var(--color-bg, #eee); border-radius: 2px; margin-bottom: 10px;
}
.progress-fill { height: 100%; background: var(--color-primary, #1976D2); border-radius: 2px; width: 0; }
.controls {
  display: flex; justify-content: center; align-items: center; gap: 16px;
}
.controls button {
  background: none; border: none; cursor: pointer; font-size: 18px; color: var(--color-text, #333);
  width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.controls button:active { background: var(--color-bg, #f0f0f0); }
.controls .btn-play { font-size: 14px; background: var(--color-primary, #1976D2); color: #fff; }
</style>
<div class="widget-root">
  <div class="cover-area" id="wi-cover">🎵</div>
  <div class="track-name" id="wi-title">未在播放</div>
  <div class="progress"><div class="progress-fill" id="wi-progress"></div></div>
  <div class="controls">
    <button id="wi-prev" title="上一首">⏮</button>
    <button class="btn-play" id="wi-play" title="播放/暂停">▶️</button>
    <button id="wi-next" title="下一首">⏭</button>
  </div>
</div>
<script>
(function() {
  var isPlaying = false, currentDuration = 0, currentPosition = 0;

  function postBg(action, data) {
    if (!window.__amiba__ || !__amiba__.background) return;
    __amiba__.background.postMessage({ action: action, data: data || {} });
  }

  document.getElementById('wi-play').onclick = function() {
    postBg(isPlaying ? 'pause' : 'resume');
    // 本地立即反馈
    isPlaying = !isPlaying;
    document.getElementById('wi-play').textContent = isPlaying ? '⏸️' : '▶️';
  };
  document.getElementById('wi-prev').onclick = function() { postBg('prev'); };
  document.getElementById('wi-next').onclick = function() { postBg('next'); };

  __amiba__.background.onMessage(function(msg) {
    updateState(msg);
  });

  // 轮询 storage 获取后台状态
  function poll() {
    __amiba__.storage.get('player_state').then(function(s) {
      if (s) updateState(s);
    }).catch(function(){});
  }
  setInterval(poll, 500);
  poll();

  function updateState(msg) {
    if (!msg) return;
    if (msg.playing !== undefined) {
      isPlaying = msg.playing;
      document.getElementById('wi-play').textContent = msg.playing ? '⏸️' : '▶️';
    }
    if (msg.currentName) {
      document.getElementById('wi-title').textContent = msg.currentName;
      document.getElementById('wi-cover').textContent = msg.playing ? '🎶' : '🎵';
    }
    if (msg.duration) {
      currentDuration = msg.duration;
      currentPosition = msg.position || 0;
      var pct = currentDuration > 0 ? (currentPosition / currentDuration) * 100 : 0;
      document.getElementById('wi-progress').style.width = pct + '%';
    }
  }
})();
</script>
