<!-- AMIBA_BRIDGE -->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; }
.widget-root {
  width: 240px; height: 240px;
  padding: 16px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  background: var(--color-surface, #fff);
  color: var(--color-text, #333);
  border-radius: 6px;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.cover-area {
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: var(--color-bg, #f5f5f5); border-radius: 6px; margin-bottom: 12px;
  font-size: 40px;
}
.track-name {
  font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; margin-bottom: 6px;
}
.progress {
  height: 3px; background: var(--color-bg, #eee); border-radius: 2px; margin-bottom: 10px;
}
.progress-fill { height: 100%; background: var(--color-primary, #1976D2); border-radius: 2px; width: 0; }
.controls {
  display: flex; justify-content: center; align-items: center; gap: 16px;
}
.controls button {
  background: none; border: none; cursor: pointer; font-size: 18px; color: var(--color-text, #333);
  width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.controls button:active { background: var(--color-bg, #f0f0f0); }
.controls .btn-play { font-size: 14px; background: var(--color-primary, #1976D2); color: #fff; }
.volume-row {
  display: flex; align-items: center; gap: 6px; margin-top: 8px;
  font-size: 11px; color: var(--color-text-secondary, #999);
}
.volume-row input[type=range] { flex: 1; accent-color: var(--color-primary, #1976D2); height: 4px; }
</style>
<div class="widget-root">
  <div class="cover-area" id="wi-cover">🎵</div>
  <div class="track-name" id="wi-title">未在播放</div>
  <div class="progress"><div class="progress-fill" id="wi-progress"></div></div>
  <div class="controls">
    <button id="wi-prev" title="上一首">⏮</button>
    <button class="btn-play" id="wi-play" title="播放/暂停">▶️</button>
    <button id="wi-next" title="下一首">⏭</button>
  </div>
  <div class="volume-row">
    <span>🔈</span>
    <input type="range" id="wi-volume" min="0" max="100" value="80">
    <span>🔊</span>
  </div>
</div>
<script>
(function() {
  var isPlaying = false, currentDuration = 0, currentPosition = 0;
  var bgReady = false;

  console.log('[Widget] 初始化');

  async function ensureBgReady() {
    if (bgReady) { console.log('[Widget] ensureBgReady: 已就绪'); return; }
    console.log('[Widget] ensureBgReady: 检查后台状态...');
    try {
      var state = await __amiba__.background.getState();
      console.log('[Widget] getState:', JSON.stringify(state));
      if (!state.running) {
        console.log('[Widget] 后台未运行，调用 start()...');
        await __amiba__.background.start();
        var state2 = await __amiba__.background.getState();
        console.log('[Widget] start 后 getState:', JSON.stringify(state2));
        if (!state2.running) throw new Error('后台启动失败');
      }
      bgReady = true;
      console.log('[Widget] ✓ 后台已就绪');
    } catch(e) {
      bgReady = false;
      console.error('[Widget] ✗ ensureBgReady 失败:', e.message || e);
    }
  }

  async function postBg(action, data) {
    if (!window.__amiba__ || !__amiba__.background) { console.warn('[Widget] __amiba__ 不可用'); return; }
    console.log('[Widget] postBg:', action, data || '');
    await ensureBgReady();
    if (!bgReady) { console.warn('[Widget] bgReady=false，跳过 postMessage'); return; }
    console.log('[Widget] → postMessage:', action);
    __amiba__.background.postMessage({ action: action, data: data || {} });
  }

  async function doPlayPause() {
    if (!bgReady) {
      await ensureBgReady();
      if (!bgReady) return;
    }
    if (isPlaying) {
      await postBg('pause');
      isPlaying = false;
      document.getElementById('wi-play').textContent = '▶️';
    } else {
      await postBg('resume');
      isPlaying = true;
      document.getElementById('wi-play').textContent = '⏸️';
    }
  }

  document.getElementById('wi-play').onclick = function() { doPlayPause(); };
  document.getElementById('wi-prev').onclick = function() { postBg('prev'); };
  document.getElementById('wi-next').onclick = function() { postBg('next'); };
  document.getElementById('wi-volume').oninput = function() {
    postBg('volume', { volume: parseInt(this.value) / 100 });
  };

  // 轮询 storage 获取后台状态
  function poll() {
    __amiba__.storage.get('player_state').then(function(s) {
      if (s) {
        console.log('[Widget] poll 读到 player_state:', JSON.stringify(s));
        updateState(s);
      }
    }).catch(function(e) {
      console.warn('[Widget] poll 读取失败:', e.message || e);
    });
  }
  setInterval(poll, 500);
  poll();

  // 启动时自动拉取后台状态（若已有缓存曲目则后台可能已在运行）
  console.log('[Widget] 启动时自动拉取后台...');
  ensureBgReady();

  function updateState(msg) {
    if (!msg) return;
    console.log('[Widget] updateState:', JSON.stringify(msg));
    if (msg.playing !== undefined) {
      isPlaying = msg.playing;
      document.getElementById('wi-play').textContent = msg.playing ? '⏸️' : '▶️';
    }
    if (msg.currentName) {
      document.getElementById('wi-title').textContent = msg.currentName;
      document.getElementById('wi-cover').textContent = msg.playing ? '🎶' : '🎵';
    }
    if (msg.duration) {
      currentDuration = msg.duration;
      currentPosition = msg.position || 0;
      var pct = currentDuration > 0 ? (currentPosition / currentDuration) * 100 : 0;
      document.getElementById('wi-progress').style.width = pct + '%';
    }
  }
})();
</script>
