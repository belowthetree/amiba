<!-- AMIBA_BRIDGE -->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.widget-root {
  min-width: 200px;
  max-width: 260px;
  padding: 12px 14px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  background: linear-gradient(160deg, #1e2648 0%, #16213e 100%);
  color: #eee;
  border-radius: 10px;
  border: 1px solid rgba(79,195,247,.18);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.wi-top { display: flex; align-items: center; gap: 10px; }
.wi-cover {
  width: 42px; height: 42px; border-radius: 9px; flex-shrink: 0;
  background: linear-gradient(135deg, #4fc3f7 0%, #7c4dff 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; box-shadow: 0 2px 10px rgba(124,77,255,.35);
}
.wi-cover.playing { animation: wi-bob 1.6s ease-in-out infinite; }
@keyframes wi-bob { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
.wi-info { flex: 1; min-width: 0; }
.wi-title {
  font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; margin-bottom: 3px;
}
.wi-time { font-size: 10px; color: #8899bb; font-variant-numeric: tabular-nums; }
.wi-progress {
  height: 4px; background: rgba(255,255,255,.12); border-radius: 2px; cursor: pointer;
}
.wi-progress:hover { height: 6px; }
.wi-progress-fill {
  height: 100%; border-radius: 2px; width: 0;
  background: linear-gradient(90deg, #4fc3f7, #7c4dff);
}
.wi-controls { display: flex; justify-content: center; align-items: center; gap: 10px; }
.wi-controls button {
  background: none; border: none; cursor: pointer; font-size: 17px; color: #bbc;
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: background .12s, color .12s;
}
.wi-controls button:hover { background: rgba(255,255,255,.1); color: #fff; }
.wi-controls .wi-btn-play {
  background: linear-gradient(135deg, #4fc3f7 0%, #7c4dff 100%);
  color: #fff; font-size: 13px; width: 36px; height: 36px;
  box-shadow: 0 2px 10px rgba(79,195,247,.35);
}
.wi-controls .wi-btn-mode { font-size: 12px; }
.wi-controls .wi-btn-mode.active { color: #4fc3f7; }
.wi-volume { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8899bb; }
.wi-volume input[type=range] { flex: 1; accent-color: #4fc3f7; height: 4px; cursor: pointer; }
</style>
<div class="widget-root">
  <div class="wi-top">
    <div class="wi-cover" id="wi-cover">🎵</div>
    <div class="wi-info">
      <div class="wi-title" id="wi-title" title="">未在播放</div>
      <div class="wi-time"><span id="wi-cur">0:00</span> / <span id="wi-dur">0:00</span></div>
    </div>
  </div>
  <div class="wi-progress" id="wi-progress-bar"><div class="wi-progress-fill" id="wi-progress"></div></div>
  <div class="wi-controls">
    <button class="wi-btn-mode" id="wi-mode" title="播放模式">🔁</button>
    <button id="wi-prev" title="上一首">⏮</button>
    <button class="wi-btn-play" id="wi-play" title="播放/暂停">▶️</button>
    <button id="wi-next" title="下一首">⏭</button>
  </div>
  <div class="wi-volume">
    <span>🔈</span>
    <input type="range" id="wi-volume" min="0" max="100" value="80">
    <span>🔊</span>
  </div>
</div>
<script>
(function() {
  var isPlaying = false, currentDuration = 0, currentPosition = 0;
  var playMode = 'sequence';
  var bgReady = false;

  var MODES = ['sequence', 'loop', 'shuffle'];
  var MODE_ICONS = { sequence: '🔁', loop: '🔂', shuffle: '🔀' };
  var MODE_NAMES = { sequence: '顺序播放', loop: '单曲循环', shuffle: '随机播放' };

  console.log('[Widget] 初始化');

  function el(id) { return document.getElementById(id); }

  function fmt(s) {
    if (!s || isNaN(s)) return '0:00';
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function updateModeBtn() {
    el('wi-mode').textContent = MODE_ICONS[playMode];
    el('wi-mode').title = MODE_NAMES[playMode];
    el('wi-mode').className = 'wi-btn-mode' + (playMode !== 'sequence' ? ' active' : '');
  }

  async function ensureBgReady() {
    if (bgReady) return;
    try {
      var state = await __amiba__.background.getState();
      if (!state.running) {
        console.log('[Widget] 后台未运行，启动中...');
        await __amiba__.background.start();
        var state2 = await __amiba__.background.getState();
        if (!state2.running) throw new Error('后台启动失败');
      }
      bgReady = true;
      console.log('[Widget] ✓ 后台已就绪');
    } catch(e) {
      bgReady = false;
      console.warn('[Widget] ✗ ensureBgReady 失败:', e.message || e);
    }
  }

  async function postBg(action, data) {
    if (!window.__amiba__ || !__amiba__.background) return;
    await ensureBgReady();
    if (!bgReady) return;
    __amiba__.background.postMessage({ action: action, data: data || {} });
  }

  el('wi-play').onclick = async function() {
    if (isPlaying) {
      await postBg('pause');
    } else {
      await postBg('resume');
    }
  };
  el('wi-prev').onclick = function() { postBg('prev'); };
  el('wi-next').onclick = function() { postBg('next'); };
  el('wi-mode').onclick = async function() {
    var i = MODES.indexOf(playMode);
    playMode = MODES[(i + 1) % MODES.length];
    updateModeBtn();
    await __amiba__.storage.set('music_mode', playMode);
    postBg('mode', { mode: playMode });
  };

  var volTimer = null;
  el('wi-volume').oninput = function() {
    var v = parseInt(this.value) / 100;
    postBg('volume', { volume: v });
    clearTimeout(volTimer);
    volTimer = setTimeout(function() { __amiba__.storage.set('music_volume', v); }, 500);
  };

  // 进度条点击跳转
  el('wi-progress-bar').onclick = function(e) {
    if (currentDuration <= 0) return;
    var rect = this.getBoundingClientRect();
    var pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    postBg('seek', { position: pct * currentDuration });
  };

  // 轮询 storage 获取后台状态
  function poll() {
    __amiba__.storage.get('player_state').then(function(s) {
      if (s) updateState(s);
    }).catch(function(){});
  }
  setInterval(poll, 500);

  function updateState(msg) {
    if (!msg) return;
    if (msg.playing !== undefined) {
      isPlaying = msg.playing;
      el('wi-play').textContent = msg.playing ? '⏸️' : '▶️';
      el('wi-cover').className = 'wi-cover' + (msg.playing ? ' playing' : '');
    }
    if (msg.currentName) {
      var name = msg.currentName.replace(/\.[^.]+$/, '');
      el('wi-title').textContent = name;
      el('wi-title').title = msg.currentName;
    }
    if (msg.mode && msg.mode !== playMode) {
      playMode = msg.mode;
      updateModeBtn();
    }
    if (msg.duration) {
      currentDuration = msg.duration;
      currentPosition = msg.position || 0;
      var pct = currentDuration > 0 ? (currentPosition / currentDuration) * 100 : 0;
      el('wi-progress').style.width = pct + '%';
      el('wi-cur').textContent = fmt(currentPosition);
      el('wi-dur').textContent = fmt(currentDuration);
    }
  }

  // 初始化：恢复音量/模式，拉取状态
  __amiba__.storage.get('music_volume').then(function(v) {
    if (v !== null && v !== undefined) el('wi-volume').value = Math.round(v * 100);
  });
  __amiba__.storage.get('music_mode').then(function(m) {
    if (m && MODES.indexOf(m) >= 0) { playMode = m; updateModeBtn(); }
  });
  poll();
  ensureBgReady();
})();
</script>
