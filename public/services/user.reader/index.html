<!-- AMIBA_BRIDGE -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文本阅读器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <!-- 书架视图 -->
  <div id="shelf-view">
    <div class="header">
      <h1>📖 文本阅读器</h1>
      <span class="book-count" id="book-count"></span>
    </div>

    <div class="section" id="auth-section">
      <p class="hint" id="auth-hint">选择包含 txt / md 文件的文件夹，构建你的书架</p>
      <button class="btn btn-primary" id="btn-pick">📁 选择文件夹</button>
      <span class="folder-path" id="folder-path"></span>
    </div>

    <div class="section">
      <div class="book-list" id="book-list"></div>
      <div class="empty" id="empty-tip" style="display:none">书架是空的，先选择文件夹</div>
    </div>
  </div>

  <!-- 阅读视图 -->
  <div id="read-view" style="display:none">
    <div class="read-bar">
      <button class="btn btn-sm" id="btn-back">‹ 书架</button>
      <span class="read-title" id="read-title"></span>
      <span class="read-page" id="read-page"></span>
    </div>
    <div class="read-content" id="read-content"></div>
    <div class="read-nav">
      <button class="btn btn-sm" id="btn-prev-page">‹ 上一页</button>
      <button class="btn btn-sm" id="btn-font">🔤 字号</button>
      <button class="btn btn-sm" id="btn-next-page">下一页 ›</button>
    </div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
