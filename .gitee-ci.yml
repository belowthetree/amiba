# ============================================================
# 变形虫 (Amiba) — Gitee Go 流水线
# ============================================================
# 触发条件：main 分支 push → 单步构建 → 发布 Gitee Release
#
# ⚠️ Gitee Go 当前限制：每条流水线仅支持 1 个 stage、1 个 step
#    因此所有操作（版本检查→构建→发布）都揉在一个 shell 脚本里
#
# 启 用：Gitee 项目 → 服务 → Gitee Go → 开启
# 变 量：项目设置 → CI/CD → 变量 → 添加（敏感信息需勾选"保密"）：
#   PRIVATE_TOKEN     — 私人令牌（user_info + projects）
#   KEYSTORE_BASE64   — Android 签名 keystore（可选，不配则打 unsigned APK）
#   KEYSTORE_PASSWORD — keystore 密码
#   KEY_PASSWORD      — key 密码
# ============================================================

version: 1.0
name: pipeline-20260705
displayName: pipeline-20260705

triggers:
  push:
    - matchType: PRECISE
      branch: main

variables:
  ANDROID_NDK_VERSION: '27.0.12077973'

stages:
  - name: build-and-release
    displayName: 构建并发布
    failFast: true
    steps:
      - step: build@golang
        name: main-build
        displayName: 版本检查 → 桌面+Android 构建 → 发布
        inputs:
          goVersion: '1.21'
          uploadArtifact: true
          uploadArtifactOptions:
            - 'dist/**/*.deb'
            - 'dist/**/*.AppImage'
            - 'dist/**/*.apk'
          goals: |
            set -e
            echo "=============================="
            echo "  Amiba Release Pipeline"
            echo "  Branch : ${GITEE_BRANCH}"
            echo "  Repo   : ${GITEE_REPO}"
            echo "=============================="

            # ============================================
            # Step 0: 版本检查（已发布则跳过）
            # ============================================
            VERSION=$(grep -oP '"version"\s*:\s*"\K[^"]+' package.json || echo "0.0.0")
            echo "📦 当前版本: v${VERSION}"
            if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
              echo "⏭ Tag v${VERSION} 已存在，跳过构建"
              exit 0
            fi
            echo "▶ 开始构建 v${VERSION}"

            # ============================================
            # Step 1: 安装 Node.js 20 + npm
            # ============================================
            apt-get update -qq
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y -qq nodejs git
            node -v && npm -v

            # ============================================
            # Step 2: 前端构建（所有平台共用）
            # ============================================
            npm ci
            npm run build

            # ============================================
            # Step 3: 安装 Rust + Tauri CLI
            # ============================================
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            source $HOME/.cargo/env
            cargo install tauri-cli --version "^2"

            # ============================================
            # Step 4: Linux 桌面构建（deb + AppImage）
            # ============================================
            echo "===== Linux 桌面构建 ====="
            apt-get install -y -qq pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
            npx tauri build --bundles deb,appimage

            mkdir -p dist/linux
            find src-tauri/target/release/bundle -name "*.deb" -exec cp {} dist/linux/ \; 2>/dev/null
            find src-tauri/target/release/bundle -name "*.AppImage" -exec cp {} dist/linux/ \; 2>/dev/null
            ls -lh dist/linux/
            echo "✅ Linux 构建完成"

            # ============================================
            # Step 5: Android APK 构建
            # ============================================
            echo "===== Android APK 构建 ====="
            apt-get install -y -qq openjdk-17-jdk curl unzip

            # Android SDK
            export ANDROID_SDK_ROOT=/opt/android-sdk
            mkdir -p $ANDROID_SDK_ROOT
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/sdk.zip
            unzip -q /tmp/sdk.zip -d /tmp/sdk
            yes | /tmp/sdk/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
              "platforms;android-34" "build-tools;34.0.0" "ndk;${ANDROID_NDK_VERSION}" 2>/dev/null
            export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}
            export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH

            # Rust Android targets
            rustup target add aarch64-linux-android x86_64-linux-android
            rustup component add rust-std --target aarch64-linux-android
            rustup component add rust-std --target x86_64-linux-android

            # 签名（可选）
            if [ -n "${KEYSTORE_BASE64}" ]; then
              echo "${KEYSTORE_BASE64}" | base64 -d > release.keystore
              export KEYSTORE_PATH=$PWD/release.keystore
              export KEY_ALIAS=amiba
              echo "✅ keystore 已就绪"
            else
              echo "⚠️ 未配置签名密钥，构建 unsigned APK"
            fi

            npx tauri android build

            mkdir -p dist/android
            find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp {} dist/android/ \; 2>/dev/null
            ls -lh dist/android/
            echo "✅ Android 构建完成"

            # ============================================
            # Step 6: 发布 Gitee Release
            # ============================================
            echo "===== 发布 Release ====="
            if [ -z "${PRIVATE_TOKEN}" ]; then
              echo "⚠️ 未配置 PRIVATE_TOKEN，跳过发布"
              exit 0
            fi

            OWNER=$(echo ${GITEE_REPO} | cut -d/ -f1)
            REPO=$(echo ${GITEE_REPO} | cut -d/ -f2)

            echo "🏷 创建 v${VERSION} Release ..."
            RESP=$(curl -s -X POST "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases" \
              -H "Content-Type: application/json" \
              -H "Authorization: token ${PRIVATE_TOKEN}" \
              -d "{
                \"tag_name\": \"v${VERSION}\",
                \"name\": \"v${VERSION}\",
                \"body\": \"自动构建于 $(date '+%Y-%m-%d %H:%M')\",
                \"target_commitish\": \"main\"
              }")
            echo "${RESP}"
            RELEASE_ID=$(echo "${RESP}" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).id || ''")
            if [ -z "${RELEASE_ID}" ]; then
              echo "❌ 创建 Release 失败"
              exit 1
            fi
            echo "✅ Release id=${RELEASE_ID}"

            for DIR in dist/linux dist/android; do
              if [ -d "${DIR}" ]; then
                for FILE in ${DIR}/*; do
                  if [ -f "${FILE}" ]; then
                    FNAME=$(basename "${FILE}")
                    echo "📤 上传 ${FNAME} ..."
                    curl -s -X POST \
                      "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases/${RELEASE_ID}/attach_files" \
                      -H "Authorization: token ${PRIVATE_TOKEN}" \
                      -F "file=@${FILE}"
                    echo ""
                  fi
                done
              fi
            done
            echo "🎉 v${VERSION} 发布完成"
